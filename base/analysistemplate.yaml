apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: argo-rollouts-analysis-template
spec:
  args:
    - name: canary-hash
  metrics:
    - name: success-rate
      interval: 30s
      count: 5
      successCondition: result[0] >= 0.95
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-server.default.svc.cluster.local:80
          query: |
            (
              sum(rate(frontend_requests_total{pod=~"argo-rollouts-app-{{args.canary-hash}}-.*", status_code!~"5.."}[2m]))
              /
              sum(rate(frontend_requests_total{pod=~"argo-rollouts-app-{{args.canary-hash}}-.*"}[2m]))
            ) or vector(1)
    - name: p95-latency
      interval: 30s
      count: 5
      successCondition: result[0] < 0.5
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-server.default.svc.cluster.local:80
          query: |
            histogram_quantile(0.95,
              sum(rate(frontend_request_duration_seconds_bucket{pod=~"argo-rollouts-app-{{args.canary-hash}}-.*"}[2m])) by (le)
            ) or vector(0)